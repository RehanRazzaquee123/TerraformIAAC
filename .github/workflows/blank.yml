# This is a basic workflow to help you get started with Actions

name: Infrastructure Deployment

# Controls when the workflow will run
on:
  workflow_dispatch:
env:
  WORKING_DIR: IAAC/environment/dev
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "Terraform"
  Terraform:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    environment: dev

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:  
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y unzip curl

      - name: Azure Login
        uses: Azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{secrets.clientId}}",
              "tenantId": "${{secrets.tenantId}}",
              "subscriptionId": "${{secrets.subscriptionId}}",
              "clientSecret": "${{secrets.clientSecret}}"
            }

      - name: Verify Login to Azure
        run:
          az group list

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3

      - name: Setup TFLint
        run: |
         # curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
         # tflint --version
           wget https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh
           chmod +x install_linux.sh
           ./install_linux.sh
           tflint --version

      - name: Install Tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          tfsec --version

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="storage_account_name=serviceconnstorageac1" \
            -backend-config="container_name=teraformpipeline" \
            -backend-config="key=pipeline.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

          


